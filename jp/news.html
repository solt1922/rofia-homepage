<!DOCTYPE html>
<html lang="ja">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ロフィア共和国 - お知らせ</title>

        body {

            background-color: #f8f8f8;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #003366;
            color: white;
            padding: 1rem;
            text-align: center;
        }
        main {
            max-width: 800px;
            margin: 2rem auto;
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .news-item {
            border-bottom: 1px solid #ccc;
            padding: 1rem 0;
        }
        .news-item:last-child {
            border-bottom: none;
        }
        .news-date {
            color: #666;
            font-size: 0.9rem;
        }
        .news-title {
            font-size: 1.2rem;
            margin: 0.3rem 0;
        }
        .news-content {
            margin-top: 0.5rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <header>
        <h1>ロフィア共和国 公式お知らせ</h1>
    </header>   

        <div class="news-item">
            <div class="news-date">2025/8/1</div>
            <div class="news-title">友好条約</div>
            <div class="news-content">
                2025/8/1 神聖カリキア=バスチィア・ヘンゼルミナ帝国との友好条約を結びました。
            </div>

</html>
