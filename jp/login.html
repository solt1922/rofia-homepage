<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ロフィア共和国 - ログイン</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <style>
    body {
      font-family: "Yu Gothic", sans-serif;
      margin: 0;
      background-color: #f4f9fb;
      color: #222;
    }
    header, footer {
      text-align: center;
      padding: 2rem 1rem;
      background-color: #2d3e50;
      color: white;
      max-width: 900px;
      margin: 0 auto;
    }
    main {
      padding: 2rem;
      max-width: 900px;
      margin: 60px auto 20px auto;
    }
    #menu-btn {
      position: fixed;
      top: 10px;
      left: 10px;
      background-color: #2d3e50;
      color: white;
      border: none;
      padding: 10px 15px;
      cursor: pointer;
      z-index: 1100;
      font-weight: bold;
    }
    .sidebar {
      background-color: #2d3e50;
      width: 180px;
      padding-top: 2rem;
      box-sizing: border-box;
      position: fixed;
      height: 100vh;
      top: 0;
      left: -180px;
      overflow-y: auto;
      transition: left 0.3s;
      z-index: 1000;
      display: flex;
      flex-direction: column;
    }
    .sidebar.show {
      left: 0;
    }
    .sidebar a {
      color: white;
      text-decoration: none;
      padding: 0.8rem 1rem;
      font-weight: bold;
    }
    .sidebar a:hover {
      background-color: #3f5873;
    }
    form {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input {
      width: 100%;
      padding: 0.6rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background: #2d3e50;
      color: white;
      border: none;
      padding: 0.7rem 1.5rem;
      border-radius: 4px;
      cursor: pointer;
    }
    #login-message {
      margin-top: 1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

<button id="menu-btn">メニュー</button>

<nav class="sidebar" id="sidebar">
  <a href="index.html">ホーム</a>
  <a href="flag.html">旗</a>
  <a href="laws.html">法律</a>
  <a href="">準備中</a>
  <a href="">準備中</a>
  <a href="">準備中</a>
  <a href="fan_guideline.html">二次創作ガイドライン</a>
</nav>

<header>
  <h1>ロフィア共和国</h1>
  <p>— 国民ログインページ —</p>
</header>

<main>
  <h2>ログインフォーム</h2>
  <form id="login-form">
    <label for="email">メールアドレス</label>
    <input type="email" id="email" required autocomplete="username" />

    <label for="password">パスワード</label>
    <input type="password" id="password" required autocomplete="current-password" />

    <button type="submit">ログイン</button>
    <div id="login-message"></div>
  </form>
</main>

<footer>
  <p>&copy; 2025 ロフィア共和国 Rofia Republic</p>
</footer>

<script>
  const menuBtn = document.getElementById('menu-btn');
  const sidebar = document.getElementById('sidebar');
  menuBtn.addEventListener('click', () => {
    sidebar.classList.toggle('show');
  });

  const supabaseUrl = 'https://vavdzddueehsdodsmlzk.supabase.co';
  const supabaseKey = 'あなたのAPIキー'; // 適切に管理してください
  const supabase = supabase.createClient(supabaseUrl, supabaseKey);

  const loginForm = document.getElementById('login-form');
  const messageDiv = document.getElementById('login-message');

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    messageDiv.textContent = '';
    messageDiv.style.color = 'black';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) throw error;

      // ログイン成功時、プロフィールの審査状況をチェック
      const userId = data.user.id;
      const { data: profile, error: profileError } = await supabase
        .from('profiles')
        .select('status')
        .eq('id', userId)
        .single();

      if (profileError || !profile) {
        messageDiv.textContent = 'プロフィール情報の取得に失敗しました。管理者にお問い合わせください。';
        messageDiv.style.color = 'red';
        return;
      }

      if (profile.status === 'approved') {
        messageDiv.textContent = 'ログイン成功！国民専用ページへ移動します。';
        messageDiv.style.color = 'green';
        setTimeout(() => {
          window.location.href = 'citizen_page.html'; // 国民専用ページURLに変更してください
        }, 1500);
      } else if (profile.status === 'pending') {
        messageDiv.textContent = '現在、入国審査中です。承認されるまでお待ちください。';
        messageDiv.style.color = 'orange';
        setTimeout(() => {
          window.location.href = 'pending.html'; // 審査中ページURLに変更してください
        }, 3000);
      } else {
        messageDiv.textContent = '入国が拒否されています。詳しくは管理者にお問い合わせください。';
        messageDiv.style.color = 'red';
      }
    } catch (error) {
      messageDiv.textContent = 'ログイン失敗: ' + error.message;
      messageDiv.style.color = 'red';
    }
  });
</script>

</body>
</html>
