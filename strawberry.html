<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>いちごキャッチゲーム</title>
<style>
  body { background: #fdf3f6; text-align: center; font-family: sans-serif; }
  canvas { background: #a3d977; border-radius: 10px; }
</style>
</head>
<body>
<h1>🍓いちごキャッチ🍓</h1>
<p>スコア: <span id="score">0</span></p>
<canvas id="gameCanvas" width="400" height="500"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let score = 0;
let basket = { x: 180, y: 380, width: 60, height: 100, speed: 8 }; // キャラの位置を少し上げてカゴが置けるように
let strawberries = [];
let currentFace = "normal";
let faceTimer = 0;

// キャラ画像
const charNormal = new Image();
charNormal.src = "rofiakun (1).png"; // 通常顔
const charHappy = new Image();
charHappy.src = "rofiakun (2).png"; // 嬉しい顔

// イチゴ画像
const strawberryImg = new Image();
strawberryImg.src = "strawberry.png"; // 本物のいちご画像

// カゴ画像
const basketImg = new Image();
basketImg.src = "basket.png"; // カゴの画像

document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") basket.x -= basket.speed;
  if (e.key === "ArrowRight") basket.x += basket.speed;
  if (basket.x < 0) basket.x = 0;
  if (basket.x > canvas.width - basket.width) basket.x = canvas.width - basket.width;
});

function spawnStrawberry() {
  strawberries.push({
    x: Math.random() * (canvas.width - 30),
    y: 0,
    size: 30,
    speed: 1.5 + Math.random() * 1
  });
}

function update() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // キャラの描画
  let charImg = currentFace === "happy" ? charHappy : charNormal;
  ctx.drawImage(charImg, basket.x, basket.y, basket.width, basket.height);

  // カゴの描画（キャラの足元）
  ctx.drawImage(basketImg, basket.x - 5, basket.y + basket.height - 10, basket.width + 10, 20);

  // イチゴ描画と移動
  strawberries.forEach((s, i) => {
    ctx.drawImage(strawberryImg, s.x, s.y, s.size, s.size);
    s.y += s.speed;

    // キャッチ判定（カゴ位置で判定）
    let basketTop = basket.y + basket.height - 10;
    if (
      s.y + s.size >= basketTop &&
      s.x + s.size > basket.x &&
      s.x < basket.x + basket.width
    ) {
      strawberries.splice(i, 1);
      score++;
      document.getElementById("score").textContent = score;

      currentFace = "happy";
      faceTimer = 30; // 約0.5秒
    }

    // 画面外に出たら削除
    if (s.y > canvas.height) {
      strawberries.splice(i, 1);
    }
  });

  // 顔戻し
  if (faceTimer > 0) {
    faceTimer--;
    if (faceTimer === 0) currentFace = "normal";
  }

  requestAnimationFrame(update);
}

setInterval(spawnStrawberry, 1000);
update();
</script>
</body>
</html>
