<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>イチゴキャッチゲーム</title>
<style>
    body {
        text-align: center;
        background-color: #f0f0f0;
    }
    canvas {
        background-color: #aee6ff;
        border: 2px solid #333;
    }
</style>
</head>
<body>
<canvas id="gameCanvas" width="500" height="500"></canvas>
<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// 画像読み込み
const basketImg = new Image();
basketImg.src = "basket.png";

const charNormal = new Image();
charNormal.src = "rofiakun (1).png";

const charHappy = new Image();
charHappy.src = "rofiakun (2).png";

const strawberryImg = new Image();
strawberryImg.src = "strawberry.png";

const bombImg = new Image();
bombImg.src = "bomb.png"; // 爆弾画像は別途用意

// キャラクター設定
let character = {
    x: canvas.width / 2 - 25,
    y: canvas.height - 120,
    width: 80,
    speed: 6,
    image: charNormal
};

// イチゴと爆弾
let strawberries = [];
let bombs = [];
let score = 0;

// アスペクト比維持で描画する関数
function drawImageAspect(img, x, y, width) {
    const aspect = img.height / img.width;
    ctx.drawImage(img, x, y, width, width * aspect);
}

// イベント
document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") {
        character.x -= character.speed;
    }
    if (e.key === "ArrowRight") {
        character.x += character.speed;
    }
});

// イチゴ生成（速度遅め）
function spawnStrawberry() {
    strawberries.push({
        x: Math.random() * (canvas.width - 40),
        y: -30,
        speed: 2
    });
}
setInterval(spawnStrawberry, 1000);

// 爆弾生成（頻度低め）
function spawnBomb() {
    if (Math.random() < 0.4) { // 40% の確率
        bombs.push({
            x: Math.random() * (canvas.width - 40),
            y: -30,
            speed: 3
        });
    }
}
setInterval(spawnBomb, 1500);

// ゲームループ
function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // キャラクター描画
    drawImageAspect(character.image, character.x, character.y, character.width);

    // バスケット描画（頭の上）
    drawImageAspect(basketImg, character.x + 15, character.y - 30, 50);

    // イチゴ描画＆移動
    strawberries.forEach((strawberry, index) => {
        strawberry.y += strawberry.speed;
        drawImageAspect(strawberryImg, strawberry.x, strawberry.y, 40);

        if (strawberry.y > canvas.height) {
            strawberries.splice(index, 1);
        }

        // キャッチ判定
        if (strawberry.x < character.x + character.width &&
            strawberry.x + 40 > character.x &&
            strawberry.y < character.y + character.width &&
            strawberry.y + 40 > character.y) {
            score++;
            character.image = charHappy;
            setTimeout(() => { character.image = charNormal; }, 300);
            strawberries.splice(index, 1);
        }
    });

    // 爆弾描画＆移動
    bombs.forEach((bomb, index) => {
        bomb.y += bomb.speed;
        drawImageAspect(bombImg, bomb.x, bomb.y, 40);

        if (bomb.y > canvas.height) {
            bombs.splice(index, 1);
        }

        // 爆弾当たり判定
        if (bomb.x < character.x + character.width &&
            bomb.x + 40 > character.x &&
            bomb.y < character.y + character.width &&
            bomb.y + 40 > character.y) {
            score--;
            bombs.splice(index, 1);
        }
    });

    // スコア描画
    ctx.fillStyle = "#000";
    ctx.font = "20px Arial";
    ctx.fillText("Score: " + score, 10, 25);

    requestAnimationFrame(gameLoop);
}
gameLoop();
</script>
</body>
</html>
