<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>いちごキャッチゲーム</title>
<style>
  body { background: #fdf3f6; text-align: center; font-family: sans-serif; }
  canvas { background: #a3d977; border-radius: 10px; }
</style>
</head>
<body>
<h1>🍓いちごキャッチ🍓</h1>
<p>スコア: <span id="score">0</span></p>
<canvas id="gameCanvas" width="400" height="500"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let score = 0;
// キャラ速度を上げる
let basket = { x: 180, y: 450, width: 50, height: 50, speed: 8 };
let strawberries = [];

document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") basket.x -= basket.speed;
  if (e.key === "ArrowRight") basket.x += basket.speed;
  // 画面外に出ないよう制限
  if (basket.x < 0) basket.x = 0;
  if (basket.x > canvas.width - basket.width) basket.x = canvas.width - basket.width;
});

function spawnStrawberry() {
  strawberries.push({
    x: Math.random() * (canvas.width - 30),
    y: 0,
    size: 30,
    // イチゴ速度を遅くする
    speed: 1.5 + Math.random() * 1
  });
}

function update() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // かご
  ctx.fillStyle = "brown";
  ctx.fillRect(basket.x, basket.y, basket.width, basket.height);

  // イチゴ描画と移動
  ctx.fillStyle = "red";
  strawberries.forEach((s, i) => {
    ctx.beginPath();
    ctx.arc(s.x + s.size/2, s.y + s.size/2, s.size/2, 0, Math.PI*2);
    ctx.fill();
    s.y += s.speed;

    // キャッチ判定
    if (
      s.y + s.size >= basket.y &&
      s.x + s.size > basket.x &&
      s.x < basket.x + basket.width
    ) {
      strawberries.splice(i, 1);
      score++;
      document.getElementById("score").textContent = score;
    }

    // 画面外に出たら消す
    if (s.y > canvas.height) {
      strawberries.splice(i, 1);
    }
  });

  requestAnimationFrame(update);
}

setInterval(spawnStrawberry, 1000);
update();
</script>
</body>
</html>
