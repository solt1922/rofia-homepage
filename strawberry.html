<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>イチゴキャッチゲーム</title>
<style>
    body {
        text-align: center;
        background-color: #f0f0f0;
    }
    canvas {
        background-color: #aee6ff;
        border: 2px solid #333;
    }
</style>
</head>
<body>
<canvas id="gameCanvas" width="500" height="500"></canvas>
<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// 画像読み込み
const basketImg = new Image();
basketImg.src = "basket.png";

const charNormal = new Image();
charNormal.src = "rofiakun (1).png";

const charHappy = new Image();
charHappy.src = "rofiakun (2).png";

const strawberryImg = new Image();
strawberryImg.src = "strawberry.png";

const bombImg = new Image();
bombImg.src = "bomb.png";

// キャラクター設定
let character = {
    x: canvas.width / 2 - 40,
    y: canvas.height - 120,
    width: 80,
    speed: 6,
    image: charNormal
};

// オブジェクト
let strawberries = [];
let bombs = [];
let score = 0;

// アスペクト比維持で描画
function drawImageAspect(img, x, y, width) {
    if (!img.complete) return; // 読み込み前は描画しない
    const aspect = img.height / img.width;
    ctx.drawImage(img, x, y, width, width * aspect);
}

// キー操作
document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") character.x -= character.speed;
    if (e.key === "ArrowRight") character.x += character.speed;
    if (character.x < 0) character.x = 0;
    if (character.x > canvas.width - character.width) character.x = canvas.width - character.width;
});

// イチゴ生成
function spawnStrawberry() {
    strawberries.push({
        x: Math.random() * (canvas.width - 40),
        y: -30,
        speed: 2
    });
}
setInterval(spawnStrawberry, 1000);

// 爆弾生成（確率低め）
function spawnBomb() {
    if (Math.random() < 0.2) { // 20% の確率
        bombs.push({
            x: Math.random() * (canvas.width - 40),
            y: -30,
            speed: 3
        });
    }
}
setInterval(spawnBomb, 1500);

// ゲームループ
function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // キャラクター描画
    drawImageAspect(character.image, character.x, character.y, character.width);
    // バスケット描画
    drawImageAspect(basketImg, character.x + 15, character.y - 30, 50);

    // イチゴ処理（後ろからループ）
    for (let i = strawberries.length - 1; i >= 0; i--) {
        let s = strawberries[i];
        s.y += s.speed;
        drawImageAspect(strawberryImg, s.x, s.y, 40);

        if (s.y > canvas.height) {
            strawberries.splice(i, 1);
            continue;
        }

        // キャッチ判定（バスケット範囲）
        let basketX = character.x + 15;
        let basketY = character.y - 30;
        let basketW = 50;
        let basketH = 30;
        if (
            s.x < basketX + basketW &&
            s.x + 40 > basketX &&
            s.y < basketY + basketH &&
            s.y + 40 > basketY
        ) {
            score++;
            character.image = charHappy;
            setTimeout(() => { character.image = charNormal; }, 300);
            strawberries.splice(i, 1);
        }
    }

    // 爆弾処理
    for (let i = bombs.length - 1; i >= 0; i--) {
        let b = bombs[i];
        b.y += b.speed;
        drawImageAspect(bombImg, b.x, b.y, 40);

        if (b.y > canvas.height) {
            bombs.splice(i, 1);
            continue;
        }

        // 当たり判定（バスケット範囲）
        let basketX = character.x + 15;
        let basketY = character.y - 30;
        let basketW = 50;
        let basketH = 30;
        if (
            b.x < basketX + basketW &&
            b.x + 40 > basketX &&
            b.y < basketY + basketH &&
            b.y + 40 > basketY
        ) {
            alert("💥ゲームオーバー！ スコア: " + score);
            document.location.reload();
        }
    }

    // スコア表示
    ctx.fillStyle = "#000";
    ctx.font = "20px Arial";
    ctx.fillText("Score: " + score, 10, 25);

    requestAnimationFrame(gameLoop);
}
gameLoop();
</script>
</body>
</html>
