<canvas id="gameCanvas" width="800" height="600"></canvas>
<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// 画像読み込み
const basketImg = new Image();
basketImg.src = "basket.png";

const playerNormalImg = new Image();
playerNormalImg.src = "rofiakun (1).png";

const playerHappyImg = new Image();
playerHappyImg.src = "rofiakun (2).png";

const strawberryImg = new Image();
strawberryImg.src = "strawberry.png";

// ゲームオブジェクト
let player = { x: 350, y: 500, width: 80, height: 80, speed: 7 };
let basket = { x: 360, y: 550, width: 80, height: 50 };
let strawberries = [];
let bombs = [];
let score = 0;
let playerImg = playerNormalImg;

// キー入力
let keys = {};
document.addEventListener("keydown", (e) => { keys[e.key] = true; });
document.addEventListener("keyup", (e) => { keys[e.key] = false; });

// イチゴ生成
function spawnStrawberry() {
    strawberries.push({
        x: Math.random() * (canvas.width - 30),
        y: -30,
        width: 30,
        height: 30,
        speed: 3
    });
}
setInterval(spawnStrawberry, 1000);

// 爆弾生成（頻度低め）
function spawnBomb() {
    bombs.push({
        x: Math.random() * (canvas.width - 30),
        y: -30,
        width: 30,
        height: 30,
        speed: 4
    });
}
setInterval(spawnBomb, 2500);

// 衝突判定
function isColliding(a, b) {
    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}

// ゲーム更新
function update() {
    if (keys["ArrowLeft"] && player.x > 0) {
        player.x -= player.speed;
        basket.x -= player.speed;
    }
    if (keys["ArrowRight"] && player.x < canvas.width - player.width) {
        player.x += player.speed;
        basket.x += player.speed;
    }

    strawberries.forEach((strawberry, i) => {
        strawberry.y += strawberry.speed;
        if (isColliding(basket, strawberry)) {
            strawberries.splice(i, 1);
            score++;
            playerImg = playerHappyImg;
            setTimeout(() => { playerImg = playerNormalImg; }, 300);
        }
    });

    bombs.forEach((bomb, i) => {
        bomb.y += bomb.speed;
        if (isColliding(basket, bomb)) {
            bombs.splice(i, 1);
            score -= 2;
        }
    });

    strawberries = strawberries.filter(s => s.y < canvas.height);
    bombs = bombs.filter(b => b.y < canvas.height);
}

// 描画
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.drawImage(playerImg, player.x, player.y, player.width, player.height);
    ctx.drawImage(basketImg, basket.x, basket.y, basket.width, basket.height);

    strawberries.forEach(strawberry => {
        ctx.drawImage(strawberryImg, strawberry.x, strawberry.y, strawberry.width, strawberry.height);
    });

    bombs.forEach(bomb => {
        ctx.beginPath();
        ctx.arc(bomb.x + bomb.width / 2, bomb.y + bomb.height / 2, bomb.width / 2, 0, Math.PI * 2);
        ctx.fillStyle = "black";
        ctx.fill();
        ctx.closePath();
    });

    ctx.fillStyle = "black";
    ctx.font = "20px Arial";
    ctx.fillText("Score: " + score, 10, 20);
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}
gameLoop();
</script>
