<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ウェブいちご狩りゲーム</title>
<style>
    body {
        background-color: #f8f0f0;
        text-align: center;
        font-family: Arial, sans-serif;
    }
    canvas {
        background-color: #cce7ff;
        display: block;
        margin: 0 auto;
        border: 2px solid #444;
    }
</style>
</head>
<body>

<h1>🍓 ウェブいちご狩りゲーム 🍓</h1>
<canvas id="gameCanvas" width="500" height="400"></canvas>
<div id="ranking"></div>

<script>
// --- ゲーム設定 ---
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let basketX = canvas.width / 2 - 25;
let basketY = canvas.height - 100;
let basketWidth = 50;
let basketHeight = 50;
let basketSpeed = 7;

let strawberryX = Math.random() * (canvas.width - 30);
let strawberryY = -30;
let strawberrySize = 30;
let strawberrySpeed = 3;

let score = 0;
let timeLeft = 30;
let gameOver = false;
let faceChange = false;

let keys = {};

// --- 画像読み込み ---
const charNormal = new Image();
charNormal.src = "char_normal.png"; // 通常時

const charHappy = new Image();
charHappy.src = "char_happy.png"; // いちご取った時

const basketImg = new Image();
basketImg.src = "basket.png";

const strawberryImg = new Image();
strawberryImg.src = "strawberry.png"; // 通常いちご

// --- キー操作 ---
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

// --- タイマー ---
let timer = setInterval(() => {
    if (!gameOver) {
        timeLeft--;
        if (timeLeft <= 0) {
            endGame();
        }
    }
}, 1000);

// --- ゲーム終了処理 ---
function endGame() {
    gameOver = true;
    clearInterval(timer);
    saveScore(score);
    drawRanking();
}

// --- スコア保存 ---
function saveScore(s) {
    let scores = JSON.parse(localStorage.getItem("ranking")) || [];
    scores.push(s);
    scores.sort((a, b) => b - a);
    scores = scores.slice(0, 5); // 上位5件だけ
    localStorage.setItem("ranking", JSON.stringify(scores));
}

// --- ランキング表示 ---
function drawRanking() {
    let scores = JSON.parse(localStorage.getItem("ranking")) || [];
    let html = "<h2>🏆 ランキング</h2><ol>";
    scores.forEach(s => {
        html += `<li>${s} 点</li>`;
    });
    html += "</ol>";
    document.getElementById("ranking").innerHTML = html;
}

// --- 描画 ---
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // キャラ描画
    if (faceChange) {
        ctx.drawImage(charHappy, basketX - 10, basketY - 80, 70, 70);
    } else {
        ctx.drawImage(charNormal, basketX - 10, basketY - 80, 70, 70);
    }

    // バスケット描画（頭上）
    ctx.drawImage(basketImg, basketX, basketY, basketWidth, basketHeight);

    // イチゴ描画
    ctx.drawImage(strawberryImg, strawberryX, strawberryY, strawberrySize, strawberrySize);

    // スコアと時間
    ctx.fillStyle = "black";
    ctx.font = "20px Arial";
    ctx.fillText(`Score: ${score}`, 10, 25);
    ctx.fillText(`Time: ${timeLeft}`, 400, 25);

    if (gameOver) {
        ctx.fillStyle = "red";
        ctx.font = "40px Arial";
        ctx.fillText("GAME OVER", canvas.width / 2 - 120, canvas.height / 2);
    }
}

// --- 更新 ---
function update() {
    if (keys["ArrowLeft"] && basketX > 0) basketX -= basketSpeed;
    if (keys["ArrowRight"] && basketX < canvas.width - basketWidth) basketX += basketSpeed;

    strawberryY += strawberrySpeed;

    // キャッチ判定
    if (
        strawberryY + strawberrySize >= basketY &&
        strawberryX + strawberrySize > basketX &&
        strawberryX < basketX + basketWidth
    ) {
        score++;
        faceChange = true;
        setTimeout(() => faceChange = false, 300);
        strawberryX = Math.random() * (canvas.width - strawberrySize);
        strawberryY = -strawberrySize;
    }

    // 画面外に落ちたらリセット
    if (strawberryY > canvas.height) {
        strawberryX = Math.random() * (canvas.width - strawberrySize);
        strawberryY = -strawberrySize;
    }
}

// --- ゲームループ ---
function gameLoop() {
    draw();
    if (!gameOver) {
        update();
        requestAnimationFrame(gameLoop);
    }
}

drawRanking();
gameLoop();
</script>
</body>
</html>

</body>
</html>
