<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ロフィアくんキャッチゲーム</title>
  <style>
    body {
      background: #f0f8ff;
      text-align: center;
      font-family: sans-serif;
      margin: 0;
    }
    canvas {
      border: 2px solid #333;
      background: #fff;
      display: block;
      margin: 0 auto;
    }
    .controls {
      margin-top: 10px;
    }
    button {
      font-size: 24px;
      padding: 10px 20px;
      margin: 5px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h1>🍓ロフィアくんキャッチゲーム🍓</h1>
  <canvas id="gameCanvas" width="500" height="700"></canvas>

  <div class="controls">
    <button onclick="moveLeft()">⬅️</button>
    <button onclick="moveRight()">➡️</button>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // キャラクター画像
    const rofiakun = new Image();
    rofiakun.src = "rofiakun (1).png";  // 同じフォルダに配置

    // アイテム画像
    const strawberry = new Image();
    strawberry.src = "strawberry.png";

    // キャラの設定
    let char = {
      x: canvas.width / 2 - 50,
      y: canvas.height - 120,
      width: 120,  // 横幅指定
      aspect: 0.517, // 縦横比（縦/横）
      speed: 20
    };

    // アイテムの配列
    let items = [];
    let score = 0;

    function spawnItem() {
      items.push({
        x: Math.random() * (canvas.width - 40),
        y: -40,
        size: 40,
        speed: 3
      });
    }

    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // キャラクターの描画（アスペクト比固定）
      const charHeight = char.width * char.aspect;
      ctx.drawImage(rofiakun, char.x, char.y, char.width, charHeight);

      // アイテム処理
      for (let i = 0; i < items.length; i++) {
        let item = items[i];
        item.y += item.speed;
        ctx.drawImage(strawberry, item.x, item.y, item.size, item.size);

        // キャッチ判定
        if (
          item.x < char.x + char.width &&
          item.x + item.size > char.x &&
          item.y < char.y + charHeight &&
          item.y + item.size > char.y
        ) {
          items.splice(i, 1);
          score++;
          i--;
        }
      }

      // スコア表示
      ctx.fillStyle = "black";
      ctx.font = "24px sans-serif";
      ctx.fillText("Score: " + score, 20, 40);
    }

    // 操作
    function moveLeft() {
      char.x -= char.speed;
      if (char.x < 0) char.x = 0;
    }

    function moveRight() {
      char.x += char.speed;
      if (char.x + char.width > canvas.width)
        char.x = canvas.width - char.width;
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") moveLeft();
      if (e.key === "ArrowRight") moveRight();
    });

    // ゲームループ
    setInterval(() => {
      update();
    }, 30);

    // アイテム生成
    setInterval(spawnItem, 1500);
  </script>
</body>
</html>
