<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>いちごキャッチゲーム</title>
<style>
  body { background: #fdf3f6; text-align: center; font-family: sans-serif; }
  canvas { background: #a3d977; border-radius: 10px; }
</style>
</head>
<body>
<h1>🍓いちごキャッチ🍓</h1>
<p>スコア: <span id="score">0</span></p>
<canvas id="gameCanvas" width="400" height="500"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let score = 0;
let player = { x: 180, y: 400, width: 60, height: 100, speed: 8 };
let strawberries = [];
let currentFace = "normal";
let faceTimer = 0;

// キャラ画像
const charNormal = new Image();
charNormal.src = "rofiakun (1).png";
const charHappy = new Image();
charHappy.src = "rofiakun (2).png";

// イチゴ画像
const strawberryImg = new Image();
strawberryImg.src = "strawberry.png";

// カゴ画像
const basketImg = new Image();
basketImg.src = "basket.png";

document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") player.x -= player.speed;
  if (e.key === "ArrowRight") player.x += player.speed;
  if (player.x < 0) player.x = 0;
  if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
});

function spawnStrawberry() {
  strawberries.push({
    x: Math.random() * (canvas.width - 30),
    y: 0,
    size: 30,
    speed: 1.5 + Math.random() * 1
  });
}

function update() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // キャラ描画
  let charImg = currentFace === "happy" ? charHappy : charNormal;
  ctx.drawImage(charImg, player.x, player.y, player.width, player.height);

  // カゴ描画（頭の上）
  let basketWidth = player.width + 20;
  let basketHeight = 20;
  let basketX = player.x - 10;
  let basketY = player.y - basketHeight + 5; // 頭の上に配置
  ctx.drawImage(basketImg, basketX, basketY, basketWidth, basketHeight);

  // イチゴ描画と移動
  strawberries.forEach((s, i) => {
    ctx.drawImage(strawberryImg, s.x, s.y, s.size, s.size);
    s.y += s.speed;

    // キャッチ判定（カゴ位置）
    if (
      s.y + s.size >= basketY &&
      s.y <= basketY + basketHeight &&
      s.x + s.size > basketX &&
      s.x < basketX + basketWidth
    ) {
      strawberries.splice(i, 1);
      score++;
      document.getElementById("score").textContent = score;
      currentFace = "happy";
      faceTimer = 30;
    }

    // 画面外に出たら削除
    if (s.y > canvas.height) {
      strawberries.splice(i, 1);
    }
  });

  // 顔戻し
  if (faceTimer > 0) {
    faceTimer--;
    if (faceTimer === 0) currentFace = "normal";
  }

  requestAnimationFrame(update);
}

setInterval(spawnStrawberry, 1000);
update();
</script>
</body>
</html>
