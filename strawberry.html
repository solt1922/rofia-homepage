<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>いちごキャッチゲーム</title>
<style>
    body {
        margin: 0;
        background-color: #f0f0f0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    canvas {
        background: #aee1f9;
        border: 2px solid #333;
    }
</style>
</head>
<body>
<canvas id="gameCanvas" width="500" height="600"></canvas>
<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let player = {
    x: canvas.width / 2 - 25,
    y: canvas.height - 100,
    width: 50,
    height: 80,
    speed: 5
};

let strawberries = [];
let bombs = [];
let score = 0;
let gameOver = false;

// キー入力
let keys = {};
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

// イチゴ生成
function spawnStrawberry() {
    let x = Math.random() * (canvas.width - 30);
    strawberries.push({ x: x, y: -30, size: 30 });
}
setInterval(spawnStrawberry, 1500); // 1.5秒に1回

// 爆弾生成
function spawnBomb() {
    let x = Math.random() * (canvas.width - 30);
    bombs.push({ x: x, y: -30, size: 30 });
}
setInterval(spawnBomb, 2000); // 2秒に1回

// 更新処理
function update() {
    if (keys["ArrowLeft"] && player.x > 0) {
        player.x -= player.speed;
    }
    if (keys["ArrowRight"] && player.x + player.width < canvas.width) {
        player.x += player.speed;
    }

    // イチゴ落下
    for (let i = strawberries.length - 1; i >= 0; i--) {
        strawberries[i].y += 3;
        if (strawberries[i].y > canvas.height) {
            strawberries.splice(i, 1);
        }
    }

    // 爆弾落下
    for (let i = bombs.length - 1; i >= 0; i--) {
        bombs[i].y += 4;
        if (bombs[i].y > canvas.height) {
            bombs.splice(i, 1);
        }
    }

    checkCollisions();
}

// 衝突判定
function checkCollisions() {
    // イチゴ
    for (let i = strawberries.length - 1; i >= 0; i--) {
        if (strawberries[i].x < player.x + player.width &&
            strawberries[i].x + strawberries[i].size > player.x &&
            strawberries[i].y < player.y + player.height &&
            strawberries[i].y + strawberries[i].size > player.y) {
            strawberries.splice(i, 1);
            score++;
        }
    }

    // 爆弾
    for (let i = bombs.length - 1; i >= 0; i--) {
        if (bombs[i].x < player.x + player.width &&
            bombs[i].x + bombs[i].size > player.x &&
            bombs[i].y < player.y + player.height &&
            bombs[i].y + bombs[i].size > player.y) {
            gameOver = true;
        }
    }
}

// 描画
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // プレイヤー
    ctx.fillStyle = "#ffcc99";
    ctx.fillRect(player.x, player.y, player.width, player.height);

    // 頭の上のバスケット
    ctx.fillStyle = "saddlebrown";
    ctx.fillRect(player.x - 10, player.y - 20, player.width + 20, 20);

    // イチゴ
    strawberries.forEach(s => {
        ctx.fillStyle = "red";
        ctx.beginPath();
        ctx.arc(s.x + s.size/2, s.y + s.size/2, s.size/2, 0, Math.PI * 2);
        ctx.fill();
    });

    // 爆弾
    bombs.forEach(b => {
        ctx.fillStyle = "black";
        ctx.beginPath();
        ctx.arc(b.x + b.size/2, b.y + b.size/2, b.size/2, 0, Math.PI * 2);
        ctx.fill();
    });

    // スコア
    ctx.fillStyle = "#000";
    ctx.font = "20px Arial";
    ctx.fillText("スコア: " + score, 10, 20);

    if (gameOver) {
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#fff";
        ctx.font = "40px Arial";
        ctx.fillText("ゲームオーバー", canvas.width/2 - 120, canvas.height/2);
    }
}

// ゲームループ
function gameLoop() {
    if (!gameOver) {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    } else {
        draw();
    }
}

gameLoop();
</script>
</body>
</html>
