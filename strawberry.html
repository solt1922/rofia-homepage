<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>いちご狩りゲーム</title>
<style>
  body {
    margin: 0;
    background-color: #cceeff;
    overflow: hidden;
    font-family: sans-serif;
    touch-action: none; /* スマホでの操作をスムーズに */
  }
  canvas {
    display: block;
    margin: 0 auto;
    background-color: #a3d977;
    border: 3px solid #333;
  }
  /* 操作ボタン */
  #controls {
    position: fixed;
    bottom: 10px;
    width: 100%;
    text-align: center;
  }
  .btn {
    display: inline-block;
    width: 80px;
    height: 80px;
    margin: 10px;
    border-radius: 50%;
    background-color: #ffcc66;
    font-size: 32px;
    font-weight: bold;
    line-height: 80px;
    text-align: center;
    user-select: none;
    border: 3px solid #333;
    box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
  }
  .btn:active {
    background-color: #ffaa33;
  }
</style>
</head>
<body>
<canvas id="gameCanvas" width="500" height="600"></canvas>

<!-- 操作ボタン -->
<div id="controls">
  <div id="leftBtn" class="btn">◀</div>
  <div id="rightBtn" class="btn">▶</div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// 画像読み込み
const playerImgNormal = new Image();
playerImgNormal.src = 'rofiakun (1).png';
const playerImgHappy = new Image();
playerImgHappy.src = 'rofiakun (2).png';
const basketImg = new Image();
basketImg.src = 'basket.png';
const strawberryImg = new Image();
strawberryImg.src = 'strawberry.png';

// プレイヤー設定（アスペクト比固定）
const aspectRatio = 0.517; // 幅 ÷ 高さ
let playerHeight = 160; // 高さだけ決める
let playerWidth = playerHeight * aspectRatio;

let player = {
    x: canvas.width / 2 - playerWidth / 2,
    y: canvas.height - playerHeight - 20,
    width: playerWidth,
    height: playerHeight,
    speed: 6,
    image: playerImgNormal,
    basketOffsetY: 20
};

// イチゴリスト
let strawberries = [];
let score = 0;
let isHappy = false;
let happyTimer = 0;

// 入力管理
let keys = {};
let leftPressed = false;
let rightPressed = false;

// キーボード入力
document.addEventListener('keydown', (e) => keys[e.key] = true);
document.addEventListener('keyup', (e) => keys[e.key] = false);

// タッチボタン入力
document.getElementById('leftBtn').addEventListener('touchstart', () => leftPressed = true);
document.getElementById('leftBtn').addEventListener('touchend', () => leftPressed = false);
document.getElementById('rightBtn').addEventListener('touchstart', () => rightPressed = true);
document.getElementById('rightBtn').addEventListener('touchend', () => rightPressed = false);

function spawnStrawberry() {
    const size = 50;
    strawberries.push({
        x: Math.random() * (canvas.width - size),
        y: -size,
        width: size,
        height: size,
        speed: 2.5
    });
}

function update() {
    // プレイヤー移動（キーボード）
    if (keys['ArrowLeft']) player.x -= player.speed;
    if (keys['ArrowRight']) player.x += player.speed;

    // プレイヤー移動（タッチ）
    if (leftPressed) player.x -= player.speed;
    if (rightPressed) player.x += player.speed;

    // 画面端制限
    if (player.x < 0) player.x = 0;
    if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

    // イチゴ移動
    strawberries.forEach(s => s.y += s.speed);

    // 衝突判定
    strawberries.forEach((s, index) => {
        if (s.x < player.x + player.width &&
            s.x + s.width > player.x &&
            s.y < player.y + player.height &&
            s.y + s.height > player.y) {
            strawberries.splice(index, 1);
            score++;
            player.image = playerImgHappy;
            isHappy = true;
            happyTimer = 20; // 表情が変わる時間
        }
    });

    // 表情タイマー
    if (isHappy) {
        happyTimer--;
        if (happyTimer <= 0) {
            isHappy = false;
            player.image = playerImgNormal;
        }
    }

    // 画面外のイチゴ削除
    strawberries = strawberries.filter(s => s.y < canvas.height + s.height);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // プレイヤー（比率固定）
    ctx.drawImage(player.image, player.x, player.y, player.width, player.height);

    // バスケット（頭の上）
    ctx.drawImage(
        basketImg,
        player.x + (player.width - 80) / 2,
        player.y - player.basketOffsetY,
        80,
        50
    );

    // イチゴ
    strawberries.forEach(s => {
        ctx.drawImage(strawberryImg, s.x, s.y, s.width, s.height);
    });

    // スコア
    ctx.fillStyle = '#000';
    ctx.font = '24px sans-serif';
    ctx.fillText('スコア: ' + score, 10, 30);
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

setInterval(spawnStrawberry, 800); // イチゴの出現頻度
gameLoop();
</script>
</body>
</html>
